[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "contextbridge-handoff"
version = "0.1.0"
description = "Local, reviewable context handoffs between AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "ContextBridge contributors"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2", "autopep8>=2,<3", "isort>=5,<7"]

[project.scripts]
contextbridge = "contextbridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[project.urls]
Repository = "https://github.com/haoranyoung09-sys/contextbridge-handoff"
Issues = "https://github.com/haoranyoung09-sys/contextbridge-handoff/issues"
