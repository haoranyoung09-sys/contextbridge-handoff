name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: contextbridge --help
      - run: python -m isort --check-only src tests
      - name: Check formatting
        shell: python
        run: |
          import subprocess
          import sys
          result = subprocess.run(
              [sys.executable, '-m', 'autopep8', '--diff', '--recursive', 'src', 'tests'],
              capture_output=True, text=True, check=True,
          )
          print(result.stdout)
          sys.exit(bool(result.stdout))
      - run: python -m build
